<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 70 820 660" width="100%" height="100%">
  <defs>
    <!-- Navy gradient for circular C and T stem -->
    <linearGradient id="ctNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061A40" />
      <stop offset="50%" stop-color="#0A2A66" />
      <stop offset="100%" stop-color="#0F3880" />
    </linearGradient>

    <!-- Royal blue gradient for city skyline skyscrapers -->
    <linearGradient id="ctSkylineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="35%" stop-color="#1D4ED8" />
      <stop offset="70%" stop-color="#0F3880" />
      <stop offset="100%" stop-color="#061A40" />
    </linearGradient>

    <!-- Grey gradient for beveled facet segments -->
    <linearGradient id="ctGreyFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Gradient for TEC in company wordmark -->
    <linearGradient id="ctTecGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F3880" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>

  <!-- NO background rect: fully transparent! -->

  <!-- ==================== 1. EMBLEM: C-T Monogram & City Skyline ==================== -->
  <g transform="translate(450, 250)">
    
    <!-- Skyline Silhouettes (Predominantly blue with grey architectural accents & white window slits) -->
    <g fill="url(#ctSkylineGrad)">
      <!-- Left side spires & buildings -->
      <polygon points="-285,45 -285,-35 -282,-35 -282,-75 -280,-75 -280,-35 -278,-35 -278,45" />
      <rect x="-275" y="-30" width="32" height="75" />
      <rect x="-238" y="-65" width="30" height="110" />
      <polygon points="-218,45 -218,-95 -214,-95 -214,-135 -212,-135 -212,-95 -208,-95 -208,45" />
      <rect x="-204" y="-50" width="28" height="95" />
      <rect x="-172" y="-90" width="38" height="135" />
      
      <!-- Windows / Glass Façade on left high-rise -->
      <g fill="#FFFFFF" opacity="0.85">
        <rect x="-166" y="-82" width="26" height="3.5" />
        <rect x="-166" y="-72" width="26" height="3.5" />
        <rect x="-166" y="-62" width="26" height="3.5" />
        <rect x="-166" y="-52" width="26" height="3.5" />
        <rect x="-166" y="-42" width="26" height="3.5" />
      </g>

      <rect x="-130" y="-35" width="30" height="80" />
      <polygon points="-96,45 -96,-15 -78,-28 -78,45" fill="#64748B" />

      <!-- Center foreground lowrises -->
      <rect x="-65" y="15" width="26" height="30" />
      <rect x="-36" y="8" width="32" height="37" />
      <rect x="0" y="16" width="28" height="29" />
      <rect x="32" y="10" width="28" height="35" />

      <!-- Right mid towers -->
      <rect x="64" y="-20" width="30" height="65" fill="#64748B" />
      <polygon points="98,45 98,-32 118,-20 118,45" />
      <rect x="122" y="-55" width="28" height="100" />

      <!-- Tall Right Tower with glass façade windows -->
      <rect x="154" y="-92" width="36" height="137" />
      <g fill="#FFFFFF" opacity="0.85">
        <rect x="160" y="-82" width="24" height="3.5" />
        <rect x="160" y="-72" width="24" height="3.5" />
        <rect x="160" y="-62" width="24" height="3.5" />
        <rect x="160" y="-52" width="24" height="3.5" />
      </g>

      <!-- Far right landmark spire tower (Empire State silhouette) -->
      <polygon points="196,45 196,-105 201,-125 202,-152 204,-152 205,-125 210,-105 210,45" />
      <rect x="215" y="-75" width="32" height="120" />
      <rect x="250" y="-42" width="30" height="87" />
      <rect x="284" y="-18" width="22" height="63" />
    </g>

    <!-- Circular "C" Outer Ring (Navy Blue) -->
    <path
      d="M -18, -165
         A 152 152 0 1 0 118, 55
         L 70, 30
         A 100 100 0 1 1 -12, -112
         L 58, -112
         L 58, -165
         Z"
      fill="url(#ctNavyGrad)"
    />

    <!-- Stylized 'T' Top Bar (Navy Blue) -->
    <path
      d="M -102, -98
         L 36, -98
         L 36, -52
         L -102, -52
         Z"
      fill="url(#ctNavyGrad)"
    />

    <!-- Stem of 'T' (Navy Blue) -->
    <path
      d="M -54, -52
         L -5, -52
         L -5, 52
         L -54, -4
         Z"
      fill="url(#ctNavyGrad)"
    />

    <!-- Right Beveled Accent Facet (Gray Segment) -->
    <path
      d="M -5, -52
         L 34, -12
         L 9, 55
         L -5, 52
         Z"
      fill="url(#ctGreyFacet)"
    />

    <!-- Upper Right Angle Bevel of C-Ring (Gray Segment) -->
    <path
      d="M 76, -136
         L 130, -80
         L 104, -56
         L 58, -112
         Z"
      fill="url(#ctGreyFacet)"
    />

    <!-- Dark Blue Curved Baseline Foundation under City -->
    <path
      d="M -300, 52
         Q 0, 28 300, 52
         L 295, 68
         Q 0, 42 -295, 68
         Z"
      fill="url(#ctNavyGrad)"
    />
  </g>

  <!-- ==================== 2. COMPANY NAME: CITYTEC ==================== -->
  <!-- Large bold uppercase: CITY in dark navy blue, TEC in royal blue gradient -->
  <g transform="translate(450, 550)">
    <text
      x="0"
      y="0"
      font-family="'Arial Black', 'Montserrat', 'Plus Jakarta Sans', Impact, sans-serif"
      font-weight="900"
      font-size="104"
      letter-spacing="12"
      text-anchor="middle"
    ><tspan fill="#061A40">CITY</tspan><tspan fill="url(#ctTecGrad)">TEC</tspan></text>
  </g>

  <!-- ==================== 3. LEGAL DESIGNATION: — SECURITY SERVICES LLP — ==================== -->
  <!-- Uppercase, significantly smaller than CITYTEC, dark gray color, thin horizontal blue lines -->
  <g transform="translate(450, 630)">
    <!-- Left Thin Horizontal Blue Line -->
    <line x1="-385" y1="-9" x2="-255" y2="-9" stroke="#1D4ED8" stroke-width="3" stroke-linecap="round" />
    
    <!-- Central Text in Dark Gray -->
    <text
      x="0"
      y="0"
      font-family="'Arial Black', 'Montserrat', 'Trebuchet MS', 'Segoe UI', sans-serif"
      font-weight="900"
      font-size="32"
      letter-spacing="7"
      text-anchor="middle"
      fill="#475569"
    >SECURITY SERVICES LLP</text>

    <!-- Right Thin Horizontal Blue Line -->
    <line x1="255" y1="-9" x2="385" y2="-9" stroke="#1D4ED8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- ==================== 4. TAGLINE: — SECURITY | TRUST | PROTECTION — ==================== -->
  <!-- Uppercase, blue lettering, separated by vertical bars (|), horizontal blue lines on both sides -->
  <g transform="translate(450, 700)">
    <!-- Left Horizontal Blue Line -->
    <line x1="-340" y1="-7" x2="-235" y2="-7" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" />

    <!-- Blue Tagline with Vertical Bars -->
    <text
      x="0"
      y="0"
      font-family="'Arial', 'Trebuchet MS', 'Segoe UI', sans-serif"
      font-weight="800"
      font-size="23"
      letter-spacing="6"
      text-anchor="middle"
      fill="#1D4ED8"
    >SECURITY   |   TRUST   |   PROTECTION</text>

    <!-- Right Horizontal Blue Line -->
    <line x1="235" y1="-7" x2="340" y2="-7" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>