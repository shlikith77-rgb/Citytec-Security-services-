        <rect x="160" y="-72" width="24" height="3.5" />
        <rect x="160" y="-62" width="24" height="3.5" />
        <rect x="160" y="-52" width="24" height="3.5" />
      </g>

      <polygon points="196,45 196,-105 201,-125 202,-152 204,-152 205,-125 210,-105 210,45" />
      <rect x="215" y="-75" width="32" height="120" />
      <rect x="250" y="-42" width="30" height="87" />
      <rect x="284" y="-18" width="22" height="63" />
