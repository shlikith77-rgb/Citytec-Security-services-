    <line x1="255" y1="-9" x2="385" y2="-9" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Line 3: — SECURITY | TRUST | PROTECTION — -->
  <g transform="translate(450, 700)">
