  <!-- Wordmark CITYTEC (Light white and sky-blue for dark mode) -->
  <g transform="translate(450, 550)">
    <text
      x="0"
      y="0"
      font-family="'Arial Black', 'Montserrat', 'Plus Jakarta Sans', Impact, sans-serif"
      font-weight="900"
      font-size="104"
      letter-spacing="12"
      text-anchor="middle"
    ><tspan fill="#FFFFFF">CITY</tspan><tspan fill="url(#ctTecDark)">TEC</tspan></text>
  </g>

  <!-- Line 2: — SECURITY SERVICES LLP — -->
  <g transform="translate(450, 630)">
    <line x1="-385" y1="-9" x2="-255" y2="-9" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" />
    <text
